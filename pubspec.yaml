name: basketapp
description: A Very Good Project created by Very Good CLI.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: ^3.44.0

dependencies:

  bloc: ^9.2.1

  cupertino_icons: ^1.0.8

  flutter:
    sdk: flutter

  # HTTP client
  dio: ^5.4.0

  # Firebase
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  firebase_messaging: ^15.2.10

  # State Management
  flutter_bloc: ^9.1.1

  # Service Locator
  get_it: ^7.6.0

  # Functional Programming
  dartz: ^0.10.1

  # Equality
  equatable: ^2.0.5

  # Connectivity
  connectivity_plus: ^6.0.0

  # Storage (optional, para future features)
  shared_preferences: ^2.2.2

  # Local Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Notifications
  flutter_local_notifications: ^17.0.0

  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

dev_dependencies:
  build_runner: ^2.4.6

  flutter_test:
    sdk: flutter
  # Hive code generation
  hive_generator: ^2.0.1

  mocktail: ^1.0.5
  very_good_analysis: ^10.3.0

flutter:
  generate: true
  uses-material-design: true